# render.yaml
# Posizione: ROOT del progetto (stessa cartella del Dockerfile)
# Questo file è OPZIONALE - serve solo per deploy automatico Blueprint

services:
  - type: web
    name: klodtattoo-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: klodtattoo-db
          property: connectionString
      - key: SMTP_SERVER
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SENDER_EMAIL
        sync: false
      - key: SENDER_NAME
        value: Klod Tattoo Studio
      - key: ADMIN_EMAIL
        value: admin@klodtattoo.com
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: klodtattoo-db
    databaseName: klodtattoo
    user: klodtattoo
    plan: free
    region: frankfurt